    max_at_below_75: 5.00
  Adwave Consumable Other:
    max_at_over_100: 3.00
    max_at_below_75: 5.00


# Sub-tactic impression share enforcement (Total Audio only)
# Streaming: min 60%, max 90% — throttle begins at 80% of max (72%)
# Podcast:   min 10%, max 40% — throttle begins at 80% of max (32%)
sub_tactic_share:
  streaming:
    min: 0.60
    max: 0.90
    throttle_entry: 0.80
  podcast:
    min: 0.10
    max: 0.40
    throttle_entry: 0.80


price_tier:
  down_min: 0.5
  down_max: 1.5
  up_norm_max: 1.3
  up_norm_min: 0.4
  up_sev_max: 1.2
  up_sev_min: 0.8

floor_spread_warn: 3.0
floor_fee_mult: 1.07

api:
  chunk_size: 40
  report_batch_size: 25
  atr_row_cap: 30000
  max_input_rows: 8000

schedule_notes: |
  Total Audio — manual runs only until fully validated.
  python -m sbo.pipeline full --config sbo/config/total_audio.yaml --sheet-id <id>