# Total Audio tactic config
# Combines Streaming + Podcast deal lists on the same line items.
# Sub-tactic-aware dollar caps (per alternative_id) are pending implementation.

tactic: total_audio

beeswax:
  account_id: 2
  bid_model_id: null
  modifier_suffix: "Total Audio IAN - API Test"
  podcast_mod_prefix:
    - "Streaming - Modifier ALL - "
    - "Podcast - Modifier ALL - "
  pub_prefix: "Marketplace CTV - Pub:"
  cat_prefix: "MP CTV Audience:"

sheet_tabs:
  beeswax_line_item_settings: "Beeswax Line Item Settings"
  sf_data_import: "SF Data Import"
  up_pacing: "UP Pacing"
  bid_optimizer: "Bid Optimizer"
  pipeline_state: "Pipeline State"
  run_log: "Run Log"
  pause_log: "Pause Log"
  reason_key: "Reason Key"
  first_run_log: "Optimizer First Run Log"
  second_run_log: "Optimizer Second Run Log"
  paused_log: "SBO Paused Log"
  paused_snapshot: "SBO Paused Multiplier Snapshot"
  pacing_history: "SBO Pacing History"
  kill_log: "Publisher Kill Log"

floor:
  max_floor_mult: 1.20
  norm_min_floor_mult: 1.10
  throttle_mult: 1.05
  kill_mult: 1.0

hard_max:
  normal: 1.20
  severe: 1.50
  last3: 2.00

cat_max_bid_eoc_bonus: 1.00


# Sub-tactic-aware fallback CPM for new terms with no clearing CPM or floor data
new_term_fallback_dollar:
  streaming: 6.00
  podcast: 11.00


max_single_day_down: 0.20

modifier_priority:
  - "iHM O&O"
  - "Minimum Guarantees"

modifier_throttle_levels:
  "Triton IHM YOFAN": 1.10
  "Triton YOFAN": 1.10
  "Spreaker": 1.15
  "Priority Publishers": 1.15

modifier_other_name:
  - "Other"
  - "Adwave Consumable Other"

# Placeholder caps — using Podcast values (higher of the two) until
# sub-tactic-aware caps are implemented via Alternative_ID.
category_max_bid_by_sub_tactic:
  streaming:
    Minimum Guarantees:
      max_at_over_100: 3.60
      max_at_below_75: 5.00
    Triton IHM YOFAN:
      max_at_over_100: 4.50
      max_at_below_75: 7.00
    Triton YOFAN:
      max_at_over_100: 5.90
      max_at_below_75: 7.00
    Priority Publishers:
      max_at_over_100: 3.50
      max_at_below_75: 5.00
    Adwave Consumable Other:
      max_at_over_100: 3.50
      max_at_below_75: 5.00
  podcast:
    Minimum Guarantees:
      max_at_over_100: 9.00
      max_at_below_75: 12.50
    Spreaker:
      max_at_over_100: 11.00
      max_at_below_75: 14.00
    Triton IHM YOFAN:
      max_at_over_100: 11.00
      max_at_below_75: 14.00
    Triton YOFAN:
      max_at_over_100: 11.00
      max_at_below_75: 14.00
    Other:
      max_at_over_100: 11.00
      max_at_below_75: 14.00    

deal_max_bid:
  "tri/449776":
    max_at_over_100: 3.00
    max_at_below_75: 5.00
    note: "AdTonos"
  "tri/449999":
    max_at_over_100: 5.00
    max_at_below_75: 7.00
