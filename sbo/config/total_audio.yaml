    max_at_over_100: 9.00
    max_at_below_75: 12.50
  Spreaker:
    max_at_over_100: 11.00
    max_at_below_75: 14.00
  Triton IHM YOFAN:
    max_at_over_100: 11.00
    max_at_below_75: 14.00
  Triton YOFAN:
    max_at_over_100: 11.00
    max_at_below_75: 14.00
  Other:
    max_at_over_100: 11.00
    max_at_below_75: 14.00
